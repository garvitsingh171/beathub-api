version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beathub_api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://db:27017/beatHub
      JWT_SECRET: local-dev-secret
      JWT_EXPIRES_IN: 7d
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mongo:6
    container_name: beathub_db
    ports:
      - "27017:27017"
    volumes:
      - db-data:/data/db
    restart: unless-stopped

volumes:
  db-data:   