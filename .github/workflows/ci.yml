name: CI

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        services:
            mongodb:
                image: mongo:7
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            NODE_ENV: test
            TEST_MONGO_URI: mongodb://127.0.0.1:27017/beathub_ci_test
            JWT_SECRET: ci-only-secret-with-at-least-32-characters
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run test:coverage -- --runInBand
